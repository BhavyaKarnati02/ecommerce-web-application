{% extends 'base.html' %}

{% block content %}

<h1>Login</h1>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">

        <input type="text"
               name="username"
               class="form-control"
               placeholder="Username">

    </div>

    <div class="mb-3">

        <input type="password"
               name="password"
               class="form-control"
               placeholder="Password">

    </div>

    <button class="btn btn-primary"
            type="submit">

        Login

    </button>

</form>

{% if error %}

<p class="text-danger mt-3">
    {{ error }}
</p>

{% endif %}

{% endblock %}
