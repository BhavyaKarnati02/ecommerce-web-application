{% extends 'base.html' %}

{% block content %}

<h1>My Orders</h1>

{% for order in orders %}

<div class="card mb-3">

    <div class="card-body">

        <h5>Order ID: {{ order.id }}</h5>

        <p>Total: ₹{{ order.total_price }}</p>

        <p>Status: {{ order.status }}</p>

        <p>Address: {{ order.address }}</p>

        <p>Date: {{ order.created_at }}</p>

    </div>

</div>

{% empty %}

<p>No orders found.</p>

{% endfor %}

{% endblock %}
