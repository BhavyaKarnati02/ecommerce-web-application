{% extends 'base.html' %}

{% block content %}

<div class="row">

    <div class="col-md-6">

        <img src="{{ product.image.url }}"
             class="img-fluid">

    </div>

    <div class="col-md-6">

        <h1>{{ product.name }}</h1>

        <p>{{ product.description }}</p>

        <h3>₹{{ product.price }}</h3>

        <p>Category: {{ product.category }}</p>

        <p>Stock: {{ product.stock }}</p>

        <a href="{% url 'add_to_cart' product.id %}"
           class="btn btn-success">
            Add to Cart
        </a>

    </div>

</div>

{% endblock %}
