{% extends 'base.html' %}

{% block content %}

<h1>Your Cart</h1>

<table class="table">

    <thead>

        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

    </thead>

    <tbody>

    {% for item in items %}

        <tr>

            <td>{{ item.product.name }}</td>

            <td>{{ item.quantity }}</td>

            <td>₹{{ item.total_price }}</td>

            <td>

                <a href="{% url 'remove_from_cart' item.id %}"
                   class="btn btn-danger">
                    Remove
                </a>

            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

<h3>Total: ₹{{ total }}</h3>

<a href="{% url 'checkout' %}"
   class="btn btn-success">
    Proceed to Checkout
</a>

{% endblock %}
